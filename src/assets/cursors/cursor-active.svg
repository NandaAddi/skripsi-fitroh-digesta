<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="activeShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0.8" dy="1.2" stdDeviation="0.6" flood-color="#090d16" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="activeGloveGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="activeCuffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Slightly offset down-right to simulate tactile push (Hotspot: 4, 4) -->
  <g transform="translate(1, 2) scale(0.96)" filter="url(#activeShadow)">
    <path d="M 3.5 2.5 
             C 2 2.5 1 4 1.2 5.8
             L 3 13.5
             C 1.5 14.5 0.5 16 0.8 17.8
             C 1.2 19.8 3.2 20.8 5 20.2
             L 5.5 20
             L 5 22.5
             C 4.8 24 6 25.5 7.5 25.5
             L 14 25.5
             C 15.5 25.5 16.5 24.2 16.5 22.8
             L 16.2 20
             C 17.8 19.5 18.8 18 18.5 16.5
             C 18.2 15.2 17.2 14.2 16 14
             C 17.2 13.2 17.8 11.8 17.5 10.2
             C 17.1 8.8 15.8 7.8 14.2 8
             L 11.5 8.2
             L 10.5 5.8
             C 9.8 4 8.2 2.5 6.5 2.5
             Z" 
          fill="url(#activeGloveGrad)" 
          stroke="#0f172a" 
          stroke-width="2" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Creases -->
    <path d="M 5 15 C 6 16.5 7.5 17 9.5 17" fill="none" stroke="#64748b" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 12 12 C 13.2 12.2 14.5 13 15 14" fill="none" stroke="#64748b" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 11.5 16 C 12.8 16.5 14 17.5 14.5 19" fill="none" stroke="#64748b" stroke-width="1.3" stroke-linecap="round"/>

    <!-- 3 Stitches -->
    <path d="M 8 11.5 L 9.5 13.5" fill="none" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 9.8 10.5 L 11.2 12.8" fill="none" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 11.8 9.8 L 13 12" fill="none" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Pressed Orange/Red Cuff -->
    <rect x="4" y="24" width="13" height="4.5" rx="2.2" fill="url(#activeCuffGrad)" stroke="#0f172a" stroke-width="1.6"/>

    <!-- Press ripples around tip -->
    <path d="M 1 0 C 0 2 0 4 1 5" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 6 0 C 7 1.5 7 3.5 6 5" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
